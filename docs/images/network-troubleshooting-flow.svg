<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="386" viewBox="0 0 1200 386" role="img" aria-labelledby="title desc">
<title id="title">Network Troubleshooting Flow</title>
<desc id="desc">Repeatable triage path for support documentation and escalation</desc>
<rect width="100%" height="100%" fill="#eef3f8"/>
<rect x="30" y="30" width="1140" height="326" rx="16" fill="#ffffff" stroke="#d5deea"/>
<text x="600.0" y="78" text-anchor="middle" font-family="Segoe UI, Arial" font-size="32" font-weight="700" fill="#172033">Network Troubleshooting Flow</text>
<text x="600.0" y="108" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#53647c">Repeatable triage path for support documentation and escalation</text>
<rect x="60" y="140" width="252" height="112" rx="10" fill="#2563a6" stroke="#1d4f86" stroke-width="2"/>
<text x="186.0" y="174" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">Baseline</text>
<text x="186.0" y="202" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#ffffff">Host, adapter, IP, route,</text>
<text x="186.0" y="222" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#ffffff">DNS resolver, gateway, and</text>
<text x="186.0" y="242" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#ffffff">internet checks</text>
<rect x="336" y="140" width="252" height="112" rx="10" fill="#f1fbf8" stroke="#6f8fc0" stroke-width="2"/>
<text x="462.0" y="174" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#172033">Failure Isolation</text>
<text x="462.0" y="202" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">DNS, port, traceroute,</text>
<text x="462.0" y="222" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">Wi-Fi, SSL, latency, and</text>
<text x="462.0" y="242" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">packet loss review</text>
<rect x="612" y="140" width="252" height="112" rx="10" fill="#fff9e8" stroke="#6f8fc0" stroke-width="2"/>
<text x="738.0" y="174" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#172033">Security Review</text>
<text x="738.0" y="202" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">Authorized ARP device</text>
<text x="738.0" y="222" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">review, MAC vendor lookup,</text>
<text x="738.0" y="242" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">and port visibility</text>
<rect x="888" y="140" width="252" height="112" rx="10" fill="#fff5f4" stroke="#6f8fc0" stroke-width="2"/>
<text x="1014.0" y="174" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#172033">Report Output</text>
<text x="1014.0" y="202" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">HTML reports support</text>
<text x="1014.0" y="222" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">tickets, escalation notes,</text>
<text x="1014.0" y="242" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#53647c">and future comparison</text>
<rect x="60" y="308" width="1080" height="38" rx="8" fill="#172033"/>
<text x="600.0" y="333" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#ffffff">Use only on networks where troubleshooting or audit activity is authorized.</text>
</svg>